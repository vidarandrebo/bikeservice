# Basic `dependabot.yml` file with
# minimum configuration for four package managers

version: 2
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
      
    cooldown:
      default-days: 7
    # Group ALL GitHub Actions updates together
    groups:
      github-actions:
        patterns:
          - "*"

  # Enable version updates for NuGet packages
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns:
          - "*"

  # Enable version updates for npm packages
  - package-ecosystem: "npm"
    directory: "/src/Client"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns:
          - "*"

  # Enable version updates for Docker images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "12:00"
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
